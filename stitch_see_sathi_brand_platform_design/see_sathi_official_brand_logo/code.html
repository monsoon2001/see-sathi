<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">

    <rect x="0" y="8" width="32" height="38" rx="16" fill="#4B4FF2" />
    <circle cx="16" cy="18" r="6" fill="#FFFFFF" opacity="0.9"/>
    <rect x="24" y="0" width="32" height="46" rx="16" fill="#FF5A3C" fill-opacity="0.92" />
    <circle cx="40" cy="12" r="6" fill="#FFFFFF" opacity="0.9"/>
    <!-- Intersecting bridge motif -->
    <path d="M16 28 C 24 24, 32 24, 40 28" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
  
  <!-- SEE Badge & Sathi Wordmark -->

    <rect x="0" y="6" width="62" height="34" rx="8" fill="#0E1020" />

    <!-- Sathi Wordmark -->
    <text x="74" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="30" fill="#0E1020" letter-spacing="-0.5">Sathi</text>
    <!-- Warm dot companion indicator -->
    <circle cx="152" cy="18" r="4.5" fill="#4B4FF2" />
  </g>
</svg>
